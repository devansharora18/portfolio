<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Devansh Arora — Software Engineer</title>
    <meta
      name="description"
      content="Devansh Arora — full-stack engineer. I love to build and I love art. Compilers, command-line tools, interfaces, and a gallery wall of both."
    />
    <meta name="author" content="Devansh Arora" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2ede0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Devansh Arora — Software Engineer" />
    <meta
      property="og:description"
      content="I love to build and I love art. Compilers, command-line tools, interfaces."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("da-art-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,300..800;1,300..800&family=Fraunces:ital,opsz,SOFT,WONK,wght@0,9..144,0..100,0..1,100..900;1,9..144,0..100,0..1,100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
